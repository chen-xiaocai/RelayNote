[project]
name = "relaynote"
version = "0.1.0"
description = "A local-first macOS menu bar todo orchestrator for Codex"
requires-python = ">=3.12"
license = {text = "MIT"}
dependencies = [
    "mcp[cli]>=2.0.0",
    "openai>=2.52.0",
    "py2app==0.28.8 ; sys_platform == 'darwin'",
    "pyobjc-framework-cocoa>=10.3; sys_platform == 'darwin'",
    "websockets>=15.0.1",
]

[project.scripts]
relaynote = "relaynote.main:main"
relaynote-ask = "relaynote.ask_mcp:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[dependency-groups]
# setuptools 71+ moved pkg_resources dependencies to top-level jaraco.text,
# which py2app 0.28.8 cannot bundle correctly.
build = [
    "setuptools<71",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.14.0",
]
